services:

# FEDORA
  ctest-base-fedora:
    build:
      context: ../
      dockerfile: docker/dockerfiles/fedora.Dockerfile
    image: ctest-base:fedora

  fedora-compile:
    image: ctest-base:fedora
    depends_on:
      - ctest-base-fedora
    volumes:
      - ../.:/home/fedora/ctest
    entrypoint: ["/bin/bash", "/home/fedora/ctest/docker/scripts/compile.sh"]

  fedora-test:
    image: ctest-base:fedora
    depends_on:
      - ctest-base-fedora
    volumes:
      - ../.:/home/fedora/ctest
    entrypoint: ["/bin/bash", "/home/fedora/ctest/docker/scripts/test.sh"]

  fedora-install:
    image: ctest-base:fedora
    depends_on:
      - ctest-base-fedora
    user: root
    volumes:
      - ../.:/home/fedora/ctest
    entrypoint: ["/bin/bash", "/home/fedora/ctest/docker/scripts/install.sh"]

  ctest-installed-fedora:
    build:
      context: ../
      dockerfile: docker/dockerfiles/fedora-shared.Dockerfile
    image: ctest-installed:fedora
    depends_on:
      - ctest-base-fedora

  fedora-shared-test:
    image: ctest-installed:fedora
    depends_on:
      - ctest-installed-fedora
    volumes:
      - ../.:/home/fedora/ctest
    entrypoint: ["/bin/bash", "/home/fedora/ctest/docker/scripts/test_shared.sh"]


# UBUNTU
  ctest-base-ubuntu:
    build:
      context: ../
      dockerfile: docker/dockerfiles/ubuntu.Dockerfile
    image: ctest-base:ubuntu

  ubuntu-compile:
    image: ctest-base:ubuntu
    depends_on:
      - ctest-base-ubuntu
    volumes:
      - ../.:/home/ubuntu/ctest
    entrypoint: ["/bin/bash", "/home/ubuntu/ctest/docker/scripts/compile.sh"]

  ubuntu-test:
    image: ctest-base:ubuntu
    depends_on:
      - ctest-base-ubuntu
    volumes:
      - ../.:/home/ubuntu/ctest
    entrypoint: ["/bin/bash", "/home/ubuntu/ctest/docker/scripts/test.sh"]

  ubuntu-install:
    image: ctest-base:ubuntu
    depends_on:
      - ctest-base-ubuntu
    user: root
    volumes:
      - ../.:/home/ubuntu/ctest
    entrypoint: ["/bin/bash", "/home/ubuntu/ctest/docker/scripts/install.sh"]

  ctest-installed-ubuntu:
    build:
      context: ../
      dockerfile: docker/dockerfiles/ubuntu-shared.Dockerfile
    image: ctest-installed:ubuntu
    depends_on:
      - ctest-base-ubuntu

  ubuntu-shared-test:
    image: ctest-installed:ubuntu
    depends_on:
      - ctest-installed-ubuntu
    volumes:
      - ../.:/home/ubuntu/ctest
    entrypoint: ["/bin/bash", "/home/ubuntu/ctest/docker/scripts/test_shared.sh"]

